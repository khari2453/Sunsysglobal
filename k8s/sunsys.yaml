apiVersion: v1
kind: Namespace
metadata:
  name: sunsys
  labels:
    app.kubernetes.io/part-of: sunsys

---
# ---- Backend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunsys-backend
  namespace: sunsys
  labels:
    app.kubernetes.io/name: sunsys-backend
    app.kubernetes.io/part-of: sunsys
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sunsys-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sunsys-backend
        app.kubernetes.io/part-of: sunsys
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: backend
          image: sunsys-backend:latest
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: PORT
              value: "5000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3

---
# ---- Backend Service ----
apiVersion: v1
kind: Service
metadata:
  name: sunsys-backend
  namespace: sunsys
  labels:
    app.kubernetes.io/name: sunsys-backend
    app.kubernetes.io/part-of: sunsys
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sunsys-backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP

---
# ---- Frontend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunsys-frontend
  namespace: sunsys
  labels:
    app.kubernetes.io/name: sunsys-frontend
    app.kubernetes.io/part-of: sunsys
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sunsys-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sunsys-frontend
        app.kubernetes.io/part-of: sunsys
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: frontend
          image: sunsys-frontend:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

---
# ---- Frontend Service ----
apiVersion: v1
kind: Service
metadata:
  name: sunsys-frontend
  namespace: sunsys
  labels:
    app.kubernetes.io/name: sunsys-frontend
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: sunsys-frontend
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP

---
# ---- NetworkPolicy: Backend accepts traffic from Frontend only ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sunsys-backend-allow-frontend-only
  namespace: sunsys
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sunsys-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sunsys-frontend
      ports:
        - port: 5000
          protocol: TCP
